<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distance Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: 'DM Sans', sans-serif;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: #1a1a2e;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #9098a9;
      margin-bottom: 2rem;
    }

    .points {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .point-block {
      background: #f7f8fa;
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
    }

    .point-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.85rem;
    }

    .badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-a { background: #ede9fe; color: #6d28d9; }
    .badge-b { background: #fde8e0; color: #c2410c; }

    .point-header span {
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 0.04em;
    }

    .coord-row {
      display: flex;
      gap: 10px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 0.72rem;
      color: #9098a9;
      font-family: 'DM Mono', monospace;
      padding-left: 2px;
    }

    .field input {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
      font-family: 'DM Mono', monospace;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .field input:focus { border-color: #7c3aed; }

    .result-block {
      background: #1a1a2e;
      border-radius: 14px;
      padding: 1.4rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .result-label {
      font-size: 0.78rem;
      color: #6b7897;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .result-value {
      font-family: 'DM Mono', monospace;
      font-size: 2rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .result-icon {
      font-size: 2rem;
      opacity: 0.2;
    }

    .sub-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .sub-stat {
      background: #f7f8fa;
      border-radius: 11px;
      padding: 0.8rem 1rem;
    }

    .sub-stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #9098a9;
      margin-bottom: 0.3rem;
    }

    .sub-stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 500;
      color: #1a1a2e;
    }

    .formula {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: #9098a9;
      background: #f7f8fa;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      line-height: 1.7;
      margin-bottom: 1.25rem;
      word-break: break-word;
    }

    .formula strong { color: #4b5563; font-weight: 500; }

    button {
      width: 100%;
      background: transparent;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      color: #9098a9;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.65rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover {
      border-color: #d1d5db;
      color: #4b5563;
      background: #f7f8fa;
    }
  </style>
</head>
<body>
<div class="card">

  <h1>Distance Calculator</h1>
  <p class="subtitle">Enter coordinates for two points in 2D space</p>

  <div class="points">
    <div class="point-block">
      <div class="point-header">
        <div class="badge badge-a">A</div>
        <span>Point A</span>
      </div>
      <div class="coord-row">
        <div class="field">
          <label>x</label>
          <input type="number" id="ax" value="0" step="any" oninput="update()" />
        </div>
        <div class="field">
          <label>y</label>
          <input type="number" id="ay" value="1" step="any" oninput="update()" />
        </div>
      </div>
    </div>

    <div class="point-block">
      <div class="point-header">
        <div class="badge badge-b">B</div>
        <span>Point B</span>
      </div>
      <div class="coord-row">
        <div class="field">
          <label>x</label>
          <input type="number" id="bx" value="1" step="any" oninput="update()" />
        </div>
        <div class="field">
          <label>y</label>
          <input type="number" id="by" value="1" step="any" oninput="update()" />
        </div>
      </div>
    </div>
  </div>

  <div class="result-block">
    <div>
      <div class="result-label">Distance</div>
      <div class="result-value" id="dist-display">1.0000</div>
    </div>
    <div class="result-icon">📐</div>
  </div>

  <div class="sub-stats">
    <div class="sub-stat">
      <div class="sub-stat-label">Δx  (horizontal)</div>
      <div class="sub-stat-value" id="dx-display">1</div>
    </div>
    <div class="sub-stat">
      <div class="sub-stat-label">Δy  (vertical)</div>
      <div class="sub-stat-value" id="dy-display">0</div>
    </div>
  </div>

  <div class="formula" id="formula-text"></div>

  <button onclick="resetPoints()">↺ Reset</button>

</div>

<script>
  function v(id) { return parseFloat(document.getElementById(id).value) || 0; }

  function fmt(n) {
    if (Math.abs(n) >= 1e6)  return n.toExponential(2);
    if (Math.abs(n) >= 1000) return n.toLocaleString('en', { maximumFractionDigits: 2 });
    return parseFloat(n.toFixed(4)).toString();
  }

  function update() {
    const ax = v('ax'), ay = v('ay'), bx = v('bx'), by = v('by');
    const dx = bx - ax, dy = by - ay;
    const dist = Math.sqrt(dx * dx + dy * dy);

    document.getElementById('dist-display').textContent = fmt(dist);
    document.getElementById('dx-display').textContent   = fmt(dx);
    document.getElementById('dy-display').textContent   = fmt(dy);
    document.getElementById('formula-text').innerHTML   =
      `√ ( (${bx} − ${ax})² + (${by} − ${ay})² )<br>` +
      `= √ ( <strong>${fmt(dx*dx)}</strong> + <strong>${fmt(dy*dy)}</strong> )<br>` +
      `= <strong>${fmt(dist)}</strong>`;
  }

  function resetPoints() {
    ['ax','ay','bx','by'].forEach((id, i) => {
      document.getElementById(id).value = [0, 1, 1, 1][i];
    });
    update();
  }

  update();
</script>
</body>
</html>
